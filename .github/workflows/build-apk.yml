name: Build APK
on:
  workflow_dispatch:   # you tap "Run" manually from the GitHub app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build Astro site
        run: |
          npm install
          npx astro build

      - name: Generate Android project
        run: npx cap add android

      - name: Inject native code
        run: |
          mkdir -p android/app/src/main/java/com/moremore/shield
          cp -r native/java/com/moremore/shield/*.kt \
            android/app/src/main/java/com/moremore/shield/
          cp native/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: shield-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
